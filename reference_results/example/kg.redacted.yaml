llm:
  extraction:
    backend: vllm
    model_path: ${MODEL_DIR}
    vllm_port: 8100
    gpu_memory_utilization: 0.7
    tensor_parallel_size: 1
    max_model_len: 8192
    temperature: 0.0
    max_tokens: 1024
  diagnosis:
    backend: vllm
    model_path: ${MODEL_DIR}
    vllm_port: 8100
    gpu_memory_utilization: 0.7
    tensor_parallel_size: 1
    max_model_len: 8192
    temperature: 0.0
    max_tokens: 4096
  embedding:
    model_path: ${EMBEDDING_DIR}
neo4j:
  uri: ${DEDICATED_EXAMPLE_GRAPH_URI}
  database: neo4j
  username: ${GRAPH_USERNAME}
  password: ''
paths:
  cve_dir: ${EXAMPLE_SAMPLES}
  synthetic_dir: ${EXAMPLE_SAMPLES}
  output_dir: ${RUN_OUTPUT}/kg
experiment:
  pipeline_mode: kg_rag
runtime:
  max_workers: 1
  retry_max_attempts: 3
  retry_wait_seconds: 5
  result_file: detection_results.json
  test_sample_count: 100
