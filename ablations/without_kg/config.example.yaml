# Use absolute dataset, model and output paths. No graph/embedding settings.
llm:
  extraction:
    backend: offline_vllm
    model_path: /path/to/Qwen3-8B
    gpu_memory_utilization: 0.9
    tensor_parallel_size: 1
    max_model_len: 16384
    temperature: 0.0
    max_tokens: 1024
  diagnosis:
    backend: offline_vllm
    model_path: /path/to/Qwen3-8B
    gpu_memory_utilization: 0.9
    tensor_parallel_size: 1
    max_model_len: 16384
    temperature: 0.2
    max_tokens: 4096
paths:
  cve_dir: /path/to/vuln_samples
  synthetic_dir: /path/to/vuln_samples
  output_dir: /path/to/ogvul-runs/without_kg/run-001
experiment:
  pipeline_mode: unified_agent_without_kg
runtime:
  max_workers: 3
  retry_max_attempts: 3
  retry_wait_seconds: 5
  result_file: detection_results_unified_agent_without_kg.json
  global_checkpoint_file: global_perception_checkpoint_without_kg.json
  global_checkpoint_version: without-kg-global-v1
  test_sample_count: 100
  agent_code_char_limit: 12000
  global_risk_code_char_limit: 0
  agent_fusion_code_char_limit: 8000
  orchestrator_retry_max_attempts: 3
